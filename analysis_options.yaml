# Base: very_good_analysis (conjunto de lints usado pela Very Good Ventures,
# referência de mercado para projetos Flutter profissionais).
# Escolhemos ele no lugar de flutter_lints porque é bem mais rigoroso:
# obriga const, tipagem de retorno, ordenação de imports, chaves em ifs, etc.
include: package:very_good_analysis/analysis_options.10.3.0.yaml

analyzer:
  # Arquivos gerados por build_runner não passam pelo linter.
  exclude:
    - "build/**"
    - ".dart_tool/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "**/*.mocks.dart"
    - "lib/firebase_options.dart"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Erro de verdade, não aviso: código que quebra em produção.
    invalid_annotation_target: ignore # ruído do freezed com json_serializable
    missing_required_param: error
    missing_return: error
    todo: ignore

linter:
  rules:
    # --- Desligados propositalmente ---
    # App, não package público: não vamos documentar cada membro.
    public_member_api_docs: false
    # Conflita com o estilo de widgets aninhados do Flutter.
    lines_longer_than_80_chars: false
    # Passar o valor default explicitamente costuma deixar o código mais claro
    # (ex.: `create_factory: true`), então não tratamos isso como problema.
    avoid_redundant_argument_values: false
    # Interfaces de um método só são justamente o padrão de UseCase.
    one_member_abstracts: false
    # Agrupamos as dependências por domínio no pubspec, não em ordem alfabética.
    sort_pub_dependencies: false
    # Nossos TODOs viram doc comment (///) com contexto de várias linhas;
    # o formato exigido por esta regra é o `//` de uma linha só.
    flutter_style_todos: false

    # --- Ligados a mais ---
    always_use_package_imports: true
    avoid_slow_async_io: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    sort_child_properties_last: true
    unawaited_futures: true
    use_key_in_widget_constructors: true
